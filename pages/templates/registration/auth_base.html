{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#fff8df">
<title>{% block title %}SusOrSafe{% endblock %}</title>
<link rel="icon" href="{% static 'susorsafe/icons/favicon.png' %}" type="image/png" sizes="64x64">
<link rel="stylesheet" href="{% static 'susorsafe/fonts.css' %}?v=19">
<link rel="stylesheet" href="{% static 'susorsafe/styles.css' %}?v=19">
<link rel="stylesheet" href="{% static 'susorsafe/v2.css' %}?v=19">
<script src="{% static 'susorsafe/theme.js' %}?v=19" defer></script>
</head>
<body class="auth-body" data-mode="{{ user_profile.age_mode|default:'kid' }}">
<main class="auth-shell">
  <a class="auth-brand" href="{% url 'home' %}">
    <img src="{% static 'susorsafe/icons/logo-mark.png' %}" alt="">
    <span><strong>SusOrSafe</strong><small>SAFETY PLAYGROUND</small></span>
  </a>

  <p class="auth-mode-note" data-age-copy-kid="Kids mode · bright colours and simple safety wording" data-age-copy-teen="Teens mode · practical guidance for school, work and online accounts" data-age-copy-adult="Adults mode · calm, practical guidance for everyday online safety">Kids mode · bright colours and simple safety wording</p>

  <section class="auth-card">
    {% block content %}{% endblock %}
  </section>

  <a class="auth-back" href="{% url 'home' %}">← Back to the island</a>
</main>
</body>
</html>
